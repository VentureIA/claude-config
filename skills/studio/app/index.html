<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141416'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff6b3d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body data-offline="false">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Studio</span>
      <span class="brand-sep" aria-hidden="true">/</span>
      <span class="brand-project" id="project-title"></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Vues">
      <button role="tab" data-tab="review" aria-selected="true">Revue</button>
      <button role="tab" data-tab="taste" aria-selected="false">Goûts</button>
    </nav>
    <div class="topbar-right">
      <span class="listening" id="listening" data-state="off">Claude n’écoute pas</span>
      <button class="btn btn-primary" id="send" disabled title="Envoyer les nouveaux commentaires à Claude (⌘↵)">
        Envoyer à Claude <span class="send-count" id="send-count">0</span>
      </button>
    </div>
  </header>

  <main class="workspace" id="view-review" data-kind="none">
    <aside class="sidebar" aria-label="Médias">
      <h2 class="sidebar-title">Médias</h2>
      <ul class="media-list" id="media-list"></ul>
      <form class="media-add" id="media-add">
        <input id="media-add-input" placeholder="Ajouter : fichier, dossier ou URL" autocomplete="off" spellcheck="false" aria-label="Ajouter un média par chemin ou URL">
      </form>
    </aside>

    <section class="center">
      <div class="stage" id="stage" data-tool="select">
        <div class="toolbar" id="toolbar" role="toolbar" aria-label="Outils d’annotation" hidden></div>
      </div>
      <div class="transport" id="transport"></div>
      <div class="timeline" id="timeline"></div>
    </section>

    <aside class="panel" id="panel" aria-label="Commentaires"></aside>
  </main>

  <main class="taste-view" id="view-taste" hidden></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app/js/main.js"></script>
</body>
</html>
